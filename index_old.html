<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleMe - Champagne Gold & Silver Sign In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.06); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 7s infinite ease-in-out;
        }
        .card-tilt {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }
        /* SVG Path Drawing Animation */
        .mp {
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawPath 2s ease forwards infinite;
        }
        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen w-screen bg-[#171410] relative overflow-hidden flex items-center justify-center font-sans text-white">

    <!-- Champagne Gold Background gradient effect -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#d4b996]/30 via-[#262019]/60 to-[#171410] pointer-events-none"></div>
    
    <!-- Top radial champagne gold glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[120vh] h-[60vh] rounded-b-[50%] bg-[#e6d5be]/25 blur-[90px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[90vh] h-[90vh] rounded-t-full bg-[#c5a059]/20 blur-[70px] animate-pulse-slow pointer-events-none"></div>

    <!-- Loading Overlay with SVG Animation -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
        <div class="w-full max-w-xl px-4">
            <svg id="svg-stage" xmlns="http://www.w3.org/2000/svg" viewBox="-40 -180 1250 1100" class="w-full h-auto">
                <path class="mp" fill="none" stroke="url(#grad)" stroke-width="6" d="M-92 17.713c154.32 237.253 348.7 486.913 585.407 466.93 137.542-17.257 247.733-123.595 279.259-239.307 27.368-100.43-21.323-229.59-140.017-241.76-118.693-12.172-208.268 98.897-231.122 199.803-34.673 151.333 12.324 312.301 125.096 429.074C639.395 749.225 815.268 819.528 995 819"/>
                
                <g class="plane">
                    <path fill="url(#grad)" opacity="0.3" d="m82.8 35 215.9 94.6L79 92l3.8-57Z"/>
                    <path fill="url(#grad)" d="m82.8 35 52-23.5 163.9 118.1-216-94.5Z"/>
                    <path fill="url(#grad)" opacity="0.3" d="m76.8 107.1 214.4 19.6L74.7 131l2.1-23.9Z"/>
                    <path fill="url(#grad)" d="M298.8 130.4 1.9 103.3l54-45 242.9 72.1Z"/>
                </g>
                
                <defs>
                    <linearGradient id="grad" x1="154" x2="160" y1="49" y2="132" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="rgb(245, 158, 11)"></stop>
                        <stop offset="1" stop-color="rgb(226, 232, 240)"></stop>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <p class="text-amber-200 text-sm tracking-widest mt-4 animate-pulse">SIGNING IN...</p>
    </div>

    <!-- Sign In Card Container (Silver Themed Box) -->
    <div class="w-full max-w-sm relative z-10 px-4">
        <div id="card" class="card-tilt relative bg-zinc-950/85 backdrop-blur-2xl rounded-2xl p-6 border border-slate-300/40 shadow-[0_0_35px_rgba(255,255,255,0.12)] overflow-hidden group">
            
            <!-- Card Border Silver Glow on Hover -->
            <div class="absolute -inset-[1px] rounded-2xl bg-gradient-to-r from-slate-300/60 via-white/40 to-slate-300/60 opacity-60 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>

            <div class="relative z-10">
                <!-- Logo Header -->
                <div class="text-center space-y-1 mb-6">
                    <div class="mx-auto w-10 h-10 rounded-full border border-slate-300/50 flex items-center justify-center bg-slate-200/15 text-slate-200 text-lg font-bold shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                        S
                    </div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-b from-white via-slate-100 to-slate-400">
                        Welcome Back
                    </h1>
                    <p class="text-slate-300/70 text-xs">
                        Sign in to continue to StyleMe
                    </p>
                </div>

                <!-- Form -->
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    
                    <!-- Email Field -->
                    <div class="flex items-center bg-white/5 border border-slate-300/30 rounded-lg overflow-hidden focus-within:border-white focus-within:bg-white/10 focus-within:shadow-[0_0_12px_rgba(255,255,255,0.25)] transition-all">
                        <div class="pl-3.5 pr-2 text-slate-300/70 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </div>
                        <input type="email" required placeholder="Email address" 
                            class="w-full bg-transparent py-3 pr-4 text-sm text-white placeholder-slate-400/60 focus:outline-none">
                    </div>

                    <!-- Password Field -->
                    <div class="flex items-center bg-white/5 border border-slate-300/30 rounded-lg overflow-hidden focus-within:border-white focus-within:bg-white/10 focus-within:shadow-[0_0_12px_rgba(255,255,255,0.25)] transition-all">
                        <div class="pl-3.5 pr-2 text-slate-300/70 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input type="password" id="password" required placeholder="Password" 
                            class="w-full bg-transparent py-3 pr-2 text-sm text-white placeholder-slate-400/60 focus:outline-none">
                        <div onclick="togglePassword()" class="pr-3.5 pl-2 flex items-center cursor-pointer text-slate-300/70 hover:text-white transition-colors">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </div>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="flex items-center justify-between text-xs pt-1">
                        <label class="flex items-center space-x-2 cursor-pointer text-slate-300/80 hover:text-white">
                            <input type="checkbox" class="rounded border-slate-300/40 bg-white/5 text-slate-200 focus:ring-0">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="text-slate-300/80 hover:text-white transition-colors">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="w-full mt-2 bg-gradient-to-r from-slate-200 via-white to-slate-300 text-black font-semibold h-11 rounded-lg hover:shadow-[0_0_20px_rgba(255,255,255,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm shadow-[0_0_12px_rgba(255,255,255,0.3)]">
                        <span id="btn-text">Sign In</span>
                        <svg id="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-hover:translate-x-1"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>

                    <!-- Divider -->
                    <div class="relative my-4 flex items-center">
                        <div class="flex-grow border-t border-slate-300/30"></div>
                        <span class="mx-3 text-xs text-slate-400">or</span>
                        <div class="flex-grow border-t border-slate-300/30"></div>
                    </div>

                    <!-- Google Sign In -->
                    <button type="button" class="w-full bg-white/5 hover:bg-white/10 border border-slate-300/30 text-slate-100 font-medium h-11 rounded-lg transition-all flex items-center justify-center gap-2 text-xs hover:shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                        <span class="font-bold text-sm text-white">G</span>
                        <span>Sign in with Google</span>
                    </button>

                    <!-- Sign Up Link -->
                    <p class="text-center text-xs text-slate-300/70 pt-2">
                        Don't have an account? <a href="signup.html" class="text-white font-medium hover:underline">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript for interactivity & 3D tilt effect -->
    <script>
        const card = document.getElementById('card');
        
        // 3D Mouse Tilt Effect
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - (rect.left + rect.width / 2);
            const y = e.clientY - (rect.top + rect.height / 2);
            
            const rotateX = (-y / 20);
            const rotateY = (x / 20);
            
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            card.style.transition = 'transform 0.5s ease-out';
        });

        card.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // Password Visibility Toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
            }
        }

        // Login Handler with SVG Loading Overlay Animation
        function handleLogin(e) {
            e.preventDefault();
            const loadingOverlay = document.getElementById('loading-overlay');
            
            loadingOverlay.classList.remove('hidden');

            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                window.location.href = 'home.html';
            }, 1500);
        }
    </script>
</body>
</html>
